plugins {
    id 'java'
}

version = '1.0'
base { archivesName = 'ShowHpMod' }

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8
sourceSets.main.java.srcDirs = ['src']

ext {
    // Đổi số này nếu muốn build theo phiên bản Mindustry khác (tag trên GitHub Anuken/Mindustry)
    mindustryVersion = 'v146'
    sdkRoot = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    compileOnly "com.github.Anuken.Arc:arc-core:$mindustryVersion"
    compileOnly "com.github.Anuken.Mindustry:core:$mindustryVersion"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 1) jar cho PC (chứa file .class + mod.json)
jar {
    archiveFileName = 'ShowHpModDesktop.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootDir) { include 'mod.json' }
    from('assets') { include '**' }   // bỏ qua nếu không có thư mục assets
}

// 2) chuyển sang dex (classes.dex) để chạy trên Android
tasks.register('jarAndroid') {
    dependsOn jar
    doLast {
        if (!sdkRoot || !new File(sdkRoot).exists()) {
            throw new GradleException('Không tìm thấy Android SDK (ANDROID_HOME).')
        }
        def platform = new File(sdkRoot, 'platforms').listFiles().sort { it.name }.reverse()
                .find { new File(it, 'android.jar').exists() }
        def tools = new File(sdkRoot, 'build-tools').listFiles().sort { it.name }.reverse()
                .find { new File(it, 'd8').exists() }
        if (platform == null || tools == null) throw new GradleException('Thiếu android.jar hoặc d8 trong Android SDK.')

        def out = new File(buildDir, 'libs/ShowHpModAndroid.jar')
        def cp = configurations.compileClasspath.files + [new File(platform, 'android.jar')]
        def cmd = [new File(tools, 'd8').path] +
                cp.collectMany { ['--classpath', it.path] } +
                ['--min-api', '14', '--output', out.path, jar.archiveFile.get().asFile.path]
        exec { commandLine cmd }
    }
}

// 3) gộp PC + Android thành 1 file mod duy nhất: ShowHpMod.jar
tasks.register('deploy', Jar) {
    dependsOn jarAndroid
    archiveFileName = 'ShowHpMod.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { zipTree(jar.archiveFile.get().asFile) }
    from { zipTree(new File(buildDir, 'libs/ShowHpModAndroid.jar')) }
}
